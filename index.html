<!doctype html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <meta content="#f8faf9" name="theme-color"/>
  <title>
   Dentivilla | Connect With Us
  </title>
  <meta content="Connect with Dentivilla Dental Clinic - Dr Mohamed Yasser El Gebaly." name="description"/>
  <style>
   /* ==========================================
   Dentivilla — Brand Tokens
   ========================================== */
:root {
  --teal: #298f90;
  --teal-dark: #236f73;
  --gold: #c5a050;
  --ink: #243a3b;
  --muted: #718383;
  --border: #dae6e3;
  --background: #f8faf9;
}

/* Base */
* { box-sizing: border-box; }
html { min-height: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
  background: radial-gradient(circle at 50% -10%, #e2f2ef 0, transparent 57%), var(--background);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
}

/* Header & branding */
.page { width: 100%; max-width: 430px; text-align: center; }
.brand {
  display: block;
  width: 155px;
  height: 155px;
  margin: 0 auto 20px;
  border-radius: 50%;
  object-fit: contain;
  box-shadow: 0 10px 30px #255f5b14;
}
h1 { margin: 0; color: var(--teal-dark); font-size: 31px; letter-spacing: -1.2px; }
.sub {
  margin: 8px 0 2px;
  color: var(--gold);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
}
.doctor { margin: 9px 0 24px; color: var(--muted); font-size: 13px; }
.separator {
  width: 110px;
  height: 1px;
  margin: 0 auto 23px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.prompt { margin: 0 0 19px; color: #526b6a; font-size: 14px; }

/* Links — all regular links have the same style */
.links { display: grid; gap: 13px; }
.social {
  display: flex;
  align-items: center;
  height: 60px;
  padding: 0 17px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: #fff;
  box-shadow: 0 6px 20px #183e3d0a;
  color: var(--teal-dark);
  text-decoration: none;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
a.social:hover {
  transform: translateY(-2px);
  border-color: var(--gold);
  box-shadow: 0 9px 23px #183e3d16;
}
a.social:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.social .icon { display: flex; align-items: center; justify-content: center; width: 30px; }
.social svg { width: 23px; height: 23px; fill: currentColor; }
.social .name { flex: 1; padding-left: 14px; font-size: 16px; font-weight: 700; text-align: left; }
.social .arr { color: var(--gold); font-size: 21px; }
.social .location-detail {
  display: block;
  padding-top: 3px;
  font-size: 11px;
  font-weight: 400;
  color: #e7f2f0;
}

/* Location — the ONLY highlighted button */
.social.location {
  background: var(--teal-dark);
  border-color: var(--teal-dark);
  color: #fff;
}
.social.location .arr { color: #ecd19c; }
a.social.location:hover { border-color: var(--gold); }

/* TikTok — visible until its link is available */
.social.disabled { opacity: .6; cursor: not-allowed; }
.social.disabled .arr { color: var(--muted); font-size: 11px; font-weight: 600; }

/* Footer & small screens */
.foot { margin: 29px auto 0; color: #8c9d99; font-size: 11px; letter-spacing: 1.1px; }
.gold { color: var(--gold); }
@media (max-width: 360px) {
  h1 { font-size: 27px; }
  .brand { width: 135px; height: 135px; }
}
  </style>
 </head>
 <body>

   </section>
   <p class="foot">
    Elegance,
    <span class="gold">

    </span>
   </p>
  </main>
 </body>
</html>
